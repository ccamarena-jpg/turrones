<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cata de Turrones</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #1a0f33;
    --card: #231445;
    --card-line: #35205f;
    --ink: #f4eefc;
    --muted: #a99bc7;
    --gold: #f2b84b;
    --gold-soft: #3d2a14;
    --violet: #b88af0;
    --violet-deep: #8d5fd6;
    --btn: #1b0f35;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif; }
  body { min-height: 100vh; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 20px 16px 120px; }
  .hidden { display: none !important; }

  /* Login */
  .login { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; gap: 22px; }
  .login h1 { font-size: 40px; line-height: 1.05; margin: 0; }
  .login h1 span { color: var(--violet); }
  .login p { color: var(--muted); margin: 0; }
  .hola { display: flex; align-items: baseline; gap: 10px; font-size: 28px; font-weight: 800; }
  .hola input { flex: 1; min-width: 0; background: transparent; border: 0; border-bottom: 3px solid var(--violet);
    color: var(--gold); font: inherit; padding: 4px 2px; outline: none; }
  .hola input::placeholder { color: #5a4883; }

  .btn { border: 0; border-radius: 999px; padding: 16px 26px; font: inherit; font-weight: 800; font-size: 18px;
    background: var(--violet); color: #1b0f35; cursor: pointer; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--muted); border: 2px solid var(--card-line); }
  .btn.small { font-size: 14px; padding: 10px 16px; }

  /* Progreso */
  .top { display: flex; justify-content: space-between; color: var(--muted); font-size: 18px; margin: 4px 0 10px; }
  .bars { display: flex; gap: 8px; margin-bottom: 18px; }
  .bars i { flex: 1; height: 10px; border-radius: 99px; background: var(--card-line); }
  .bars i.on { background: var(--violet); }
  .bars i.done { background: var(--gold); }

  .head { display: flex; gap: 16px; align-items: center; margin-bottom: 18px; }
  .badge { width: 84px; height: 84px; flex: none; border-radius: 22px; background: var(--violet); color: #1b0f35;
    font-size: 44px; font-weight: 800; display: grid; place-items: center; }
  .head h2 { margin: 0 0 4px; font-size: 32px; }
  .head p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.3; }

  .crit { background: var(--card); border: 1.5px solid var(--card-line); border-radius: 26px; padding: 18px 18px 14px; margin-bottom: 16px; }
  .crit.main { border-color: var(--gold); }
  .crit h3 { margin: 0 0 4px; font-size: 22px; }
  .crit p { margin: 0 0 14px; color: var(--muted); font-size: 15px; }
  .scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .scale button { aspect-ratio: 1; border-radius: 18px; border: 2px solid var(--card-line); background: #150a2b;
    color: var(--ink); font: inherit; font-size: 24px; font-weight: 800; cursor: pointer; }
  .scale button.fill { background: var(--gold-soft); border-color: var(--gold); }
  .scale button.sel { background: var(--gold); color: #2a1a05; }
  .ends { display: flex; justify-content: space-between; color: var(--muted); margin-top: 10px; font-size: 15px; }

  .nav { position: fixed; left: 0; right: 0; bottom: 0; background: linear-gradient(transparent, var(--bg) 35%); padding: 24px 16px calc(16px + env(safe-area-inset-bottom)); }
  .nav .in { max-width: 480px; margin: 0 auto; display: flex; gap: 12px; }
  .nav .btn { flex: 1; }
  .nav .btn.ghost { flex: .8; }

  /* Resultados */
  .res h2 { font-size: 32px; margin: 8px 0 4px; }
  .res .sub { color: var(--muted); margin: 0 0 18px; }
  .winner { background: linear-gradient(135deg, #4a2b86, #2a1656); border: 2px solid var(--gold); border-radius: 26px; padding: 20px; margin-bottom: 16px; }
  .winner small { color: var(--gold); font-weight: 800; letter-spacing: .08em; }
  .winner h3 { margin: 4px 0 2px; font-size: 30px; }
  .rank { display: flex; flex-direction: column; gap: 12px; }
  .row { background: var(--card); border: 1.5px solid var(--card-line); border-radius: 22px; padding: 14px 16px; }
  .row .t { display: flex; align-items: center; gap: 12px; }
  .pos { width: 38px; height: 38px; border-radius: 12px; background: var(--violet); color: #1b0f35; font-weight: 800; display: grid; place-items: center; flex: none; }
  .row:first-child .pos { background: var(--gold); }
  .row .name { font-weight: 800; font-size: 19px; flex: 1; }
  .row .score { font-size: 24px; font-weight: 800; color: var(--gold); }
  .mini { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; text-align: center; }
  .mini div { background: #150a2b; border-radius: 12px; padding: 8px 2px; }
  .mini b { display: block; font-size: 17px; }
  .mini span { color: var(--muted); font-size: 12px; }
  .bar { height: 8px; border-radius: 99px; background: #150a2b; margin-top: 12px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--gold); border-radius: 99px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
  details { margin-top: 18px; background: var(--card); border-radius: 18px; padding: 12px 14px; border: 1.5px solid var(--card-line); }
  summary { cursor: pointer; font-weight: 800; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
  th, td { text-align: center; padding: 6px 3px; border-bottom: 1px solid var(--card-line); }
  th:first-child, td:first-child { text-align: left; }
  .note { color: var(--muted); font-size: 13px; margin-top: 14px; }
  .err { color: #ff9b9b; font-size: 14px; }
</style>
</head>
<body>

<!-- LOGIN -->
<main id="login" class="wrap login">
  <div>
    <h1>Cata de<br><span>Turrones</span></h1>
  </div>
  <p>Cuatro turrones, una sola ganadora. Califica con calma y sin copiar al vecino.</p>
  <label class="hola">Hola,
    <input id="nombre" type="text" placeholder="tu nombre" maxlength="40" autocomplete="given-name">
  </label>
  <button id="entrar" class="btn" disabled>Empezar la cata</button>
  <button id="verRes0" class="btn ghost small" style="align-self:flex-start">Ver resultados</button>
</main>

<!-- CATA -->
<main id="cata" class="wrap hidden">
  <div class="top"><span id="saludo"></span><span id="paso"></span></div>
  <div class="bars" id="bars"></div>
  <div class="head">
    <div class="badge" id="num"></div>
    <div><h2 id="tname"></h2><p>Prueba un trozo con calma antes de calificar.</p></div>
  </div>
  <div id="criterios"></div>
  <div class="nav"><div class="in">
    <button id="ant" class="btn ghost">Anterior</button>
    <button id="sig" class="btn" disabled>Siguiente</button>
  </div></div>
</main>

<!-- RESULTADOS -->
<main id="res" class="wrap res hidden">
  <h2>Resultados</h2>
  <p class="sub" id="resSub"></p>
  <div id="winner"></div>
  <div class="rank" id="rank"></div>
  <details><summary>Votos por persona</summary><div style="overflow-x:auto" id="tabla"></div></details>
  <div class="actions">
    <button id="xlsx" class="btn small">Descargar Excel</button>
    <button id="refrescar" class="btn small ghost">Actualizar</button>
    <button id="volver" class="btn small ghost">Volver al inicio</button>
  </div>
  <p class="note" id="modo"></p>
</main>

<script>
/* ===== Configuración =====
   Pega aquí la URL /exec de tu Apps Script (ver apps-script/Code.gs) para guardar
   en un Google Sheet compartido. Vacío = se guarda solo en este navegador. */
const API_URL = "https://script.google.com/macros/s/AKfycbyEl9g9nfUSnnfFvGLR00STRMaS4LDyKlKh9pWToLBpo_r8di13JexhJXV1f414waQ36A/exec";

const TURRONES = ["Dolce Capriccio", "La Nuez", "San Antonio", "San José"];
const CRITERIOS = [
  { k: "masa",    t: "Masa",    d: "Textura, consistencia y cómo se deshace." },
  { k: "miel",    t: "Miel",    d: "Sabor, dulzor y presencia de la miel." },
  { k: "textura", t: "Textura", d: "Crocante, suave o pegajoso: cómo se siente al morder." },
  { k: "sabor",   t: "Sabor",   d: "Balance general de sabores y ganas de repetir." },
  { k: "general", t: "Puntaje general", d: "Tu nota global. Esta decide al ganador.", main: true },
];
const $ = id => document.getElementById(id);
let nombre = "", paso = 0, notas = {};

/* ===== Almacenamiento ===== */
const LS = "turrones_filas";
let memoria = [];
const leerLocal = () => { try { return JSON.parse(localStorage.getItem(LS)) || []; } catch { return memoria; } };
const escribirLocal = v => { memoria = v; try { localStorage.setItem(LS, JSON.stringify(v)); } catch {} };
const norm = s => s.trim().toLowerCase();

async function guardar(filas) {
  if (API_URL) {
    const r = await fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ filas }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "Error al guardar");
    return;
  }
  const todas = leerLocal();
  filas.forEach(f => {
    const i = todas.findIndex(x => norm(x.nombre) === norm(f.nombre) && x.turron === f.turron);
    if (i >= 0) todas[i] = f; else todas.push(f);
  });
  escribirLocal(todas);
}
async function cargar() {
  if (API_URL) {
    const r = await fetch(API_URL);
    const j = await r.json();
    return j.filas || [];
  }
  return leerLocal();
}

/* ===== Login ===== */
$("nombre").addEventListener("input", e => $("entrar").disabled = !e.target.value.trim());
$("nombre").addEventListener("keydown", e => { if (e.key === "Enter" && !$("entrar").disabled) $("entrar").click(); });
$("entrar").onclick = () => {
  nombre = $("nombre").value.trim();
  paso = 0; notas = {};
  TURRONES.forEach(t => notas[t] = {});
  mostrar("cata"); pintar();
};
$("verRes0").onclick = verResultados;

function mostrar(id) {
  ["login", "cata", "res"].forEach(x => $(x).classList.toggle("hidden", x !== id));
  window.scrollTo(0, 0);
}

/* ===== Cata ===== */
function completo(t) { return CRITERIOS.every(c => notas[t][c.k]); }

function pintar() {
  const t = TURRONES[paso];
  $("saludo").textContent = "Hola, " + nombre;
  $("paso").textContent = (paso + 1) + " de " + TURRONES.length;
  $("bars").innerHTML = TURRONES.map((x, i) => `<i class="${i === paso ? "on" : i < paso ? "done" : ""}"></i>`).join("");
  $("num").textContent = paso + 1;
  $("tname").textContent = t;
  $("criterios").innerHTML = CRITERIOS.map(c => {
    const v = notas[t][c.k] || 0;
    const btns = [1, 2, 3, 4, 5].map(n =>
      `<button data-k="${c.k}" data-n="${n}" class="${n === v ? "sel" : n < v ? "fill" : ""}">${n}</button>`).join("");
    return `<section class="crit ${c.main ? "main" : ""}"><h3>${c.t}</h3><p>${c.d}</p>
      <div class="scale">${btns}</div><div class="ends"><span>Flojo</span><span>Gloria</span></div></section>`;
  }).join("");
  $("ant").style.visibility = paso === 0 ? "hidden" : "visible";
  $("sig").textContent = paso === TURRONES.length - 1 ? "Finalizar" : "Siguiente";
  $("sig").disabled = !completo(t);
}

$("criterios").addEventListener("click", e => {
  const b = e.target.closest("button[data-k]");
  if (!b) return;
  notas[TURRONES[paso]][b.dataset.k] = +b.dataset.n;
  pintar();
});
$("ant").onclick = () => { paso--; pintar(); window.scrollTo(0, 0); };
$("sig").onclick = async () => {
  if (paso < TURRONES.length - 1) { paso++; pintar(); window.scrollTo(0, 0); return; }
  $("sig").disabled = true; $("sig").textContent = "Guardando…";
  const fecha = new Date().toISOString();
  const filas = TURRONES.map(t => ({ fecha, nombre, turron: t, ...notas[t] }));
  try { await guardar(filas); verResultados(); }
  catch (err) { alert("No se pudo guardar: " + err.message); pintar(); }
};

/* ===== Resultados ===== */
const prom = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0;
let ultimas = [];

function calcular(filas) {
  return TURRONES.map(t => {
    const f = filas.filter(x => x.turron === t);
    const o = { turron: t, votos: f.length };
    CRITERIOS.forEach(c => o[c.k] = prom(f.map(x => +x[c.k])));
    return o;
  }).sort((a, b) => b.general - a.general || b.votos - a.votos);
}

async function verResultados() {
  mostrar("res");
  $("rank").innerHTML = "<p class='note'>Cargando…</p>";
  let filas;
  try { filas = await cargar(); } catch (e) { $("rank").innerHTML = "<p class='err'>No se pudieron cargar los datos.</p>"; return; }
  ultimas = filas;
  const r = calcular(filas);
  const personas = new Set(filas.map(f => norm(f.nombre))).size;
  $("resSub").textContent = personas ? `${personas} ${personas === 1 ? "persona calificó" : "personas calificaron"}.` : "Aún no hay calificaciones.";
  $("modo").textContent = API_URL ? "Datos guardados en Google Sheets." : "Modo local: los datos se guardan solo en este navegador. Configura API_URL para compartirlos en un Sheet.";

  $("winner").innerHTML = personas ? `<div class="winner"><small>GANADOR</small><h3>${r[0].turron}</h3><span>${r[0].general.toFixed(2)} de 5 en puntaje general</span></div>` : "";
  $("rank").innerHTML = r.map((x, i) => `
    <div class="row">
      <div class="t"><div class="pos">${i + 1}</div><div class="name">${x.turron}</div><div class="score">${x.general.toFixed(2)}</div></div>
      <div class="bar"><i style="width:${x.general / 5 * 100}%"></i></div>
      <div class="mini">${CRITERIOS.filter(c => !c.main).map(c => `<div><b>${x[c.k].toFixed(1)}</b><span>${c.t}</span></div>`).join("")}</div>
    </div>`).join("");

  const th = CRITERIOS.map(c => `<th>${c.t === "Puntaje general" ? "Gral" : c.t.slice(0, 4)}</th>`).join("");
  $("tabla").innerHTML = `<table><tr><th>Nombre</th><th>Turrón</th>${th}</tr>` +
    filas.map(f => `<tr><td>${esc(f.nombre)}</td><td>${esc(f.turron)}</td>${CRITERIOS.map(c => `<td>${f[c.k]}</td>`).join("")}</tr>`).join("") + "</table>";
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

$("refrescar").onclick = verResultados;
$("volver").onclick = () => mostrar("login");
$("xlsx").onclick = () => {
  const cal = ultimas.map(f => ({ Fecha: f.fecha, Nombre: f.nombre, Turrón: f.turron, Masa: f.masa, Miel: f.miel, Textura: f.textura, Sabor: f.sabor, "Puntaje general": f.general }));
  const rk = calcular(ultimas).map((x, i) => ({ Posición: i + 1, Turrón: x.turron, Votos: x.votos, Masa: +x.masa.toFixed(2), Miel: +x.miel.toFixed(2), Textura: +x.textura.toFixed(2), Sabor: +x.sabor.toFixed(2), "Puntaje general": +x.general.toFixed(2) }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(cal), "Calificaciones");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rk), "Ranking");
  XLSX.writeFile(wb, "cata-turrones.xlsx");
};
</script>
</body>
</html>
